# Führt die Prüfungen aus tests/ bei jedem Pull Request aus.
#
# WARUM ES DIESEN LAUF GIBT: In dieser App scheitert das meiste STILL. Ein
# ungültiger CSS-Kurzschreiber wirft die ganze Anweisung weg, eine zu schwache
# Regel verliert gegen eine stärkere, eine zu früh genommene Messung schreibt
# eine falsche Höhe, ein Übersetzungsschlüssel fehlt in vier von fünf Sprachen
# — nichts davon wird rot. Wer es merkt, ist sonst derjenige, der die App
# benutzt. Genau diese Fälle stehen in tests/faelle/, jeder mit der Panne im
# Kopf der Datei, aus der er entstanden ist.
#
# WARUM CHROME AUS DEM LÄUFER: Auf den ubuntu-latest-Läufern ist Chrome
# vorinstalliert. Damit entfällt „playwright install" — rund 130 MB Download je
# Lauf für einen Browser, der schon da ist. tests/hilfen.mjs sucht ihn in
# dieser Reihenfolge: CHROMIUM_PFAD, PLAYWRIGHT_BROWSERS_PATH, System-Chrome.
#
# WARUM KEIN NPM CI IM WURZELVERZEICHNIS: Die App hat keinen Build-Schritt und
# soll keine package.json bekommen, die etwas anderes nahelegt. Die
# Abhängigkeiten liegen unter tests/: playwright-core (nur der Treiber ohne
# Browser) und three in genau der Fassung, die die App vom CDN lädt. Ein
# Prüfrechner ohne Netz bekäme die Bibliothek sonst nie, und der echte
# 3D-Würfel — den fast alle sehen — bliebe ungeprüft; der Fall spielrunde
# leitet die CDN-Anfrage deshalb auf node_modules um.
#
# WARUM AUCH AUF push:main — und was das ausgleicht: Der Commit der
# Versions-Automatik (version.yml) trägt die Sprungmarke „skip ci" im Betreff.
# GitHub überspringt daraufhin auch das synchronize-Ereignis des Pull Requests,
# dieser Lauf hier läuft für den Nachtrag also NICHT erneut. Geprüft ist damit
# der Code-Commit, nicht der zusammengeführte Stand. Angefasst hat der Nachtrag
# nur <meta name="app-version"> und die ?v=-Werte in index.html — und der
# Squash auf main trägt die Marke nicht, löst hier also sofort einen vollen
# Lauf aus. Diese beiden Hälften ergeben zusammen die Abdeckung; wer eine davon
# entfernt, sollte die andere ersetzen.

name: Prüfungen

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Ein Lauf je Pull Request. Ein überholter Lauf prüft einen Stand, den niemand
# mehr zusammenführen will.
concurrency:
  group: pruefungen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Abhängigkeiten
        working-directory: tests
        run: npm ci

      - name: Prüfungen
        working-directory: tests
        run: npm test
