# Hält die beiden Nummern in index.html selbsttätig auf Stand:
#
#   <meta name="app-version">  — der ausgelieferte Stand nach Semantic Versioning
#   ?v= an jedem href/src      — Cache-Buster je Datei, aus dem Inhalt berechnet
#
# WARUM DAS NÖTIG IST: Die App liegt auf GitHub Pages (impliziter Workflow
# pages-build-deployment) und auf Vercel. Pages liefert mit
# „cache-control: max-age=600" OHNE must-revalidate aus — ein Browser darf die
# alte Datei also zehn Minuten weiterverwenden, ohne nachzufragen. Genau darauf
# zeigt auch die Überwachung in .upptime.yml. Von Hand ist das dreimal
# hintereinander vergessen worden (#103, #104, #105 haben app.js, i18n.js und
# style.css geändert, index.html aber nicht angefasst).
#
# WARUM VOR DEM ZUSAMMENFÜHREN, NICHT DANACH: Liefe das erst auf main, wäre
# der Zielzweig zwischen Merge und Nachtrag-Commit kurz inkonsistent — neue
# Dateien hinter alten ?v=. Pages baut in dem Fenster schon aus. Als Commit im
# Pull Request ist die Nummer Teil des Merges, main also nie falsch.
#
# WARUM DIE STUFE AUS DEM TITEL: Ob eine Änderung Major, Minor oder Patch ist,
# kann kein Programm entscheiden. Ein Automatismus, der stur Patch hochzählt,
# macht die Nummer zum Zähler mit Punkten — genau davon ist #102 weggegangen.
# Fehlt die Angabe, schlägt der Lauf mit einer Anleitung fehl, statt zu raten:
# lieber gar keine Version als eine erfundene (dieselbe Regel wie in app.js:35).

name: Version und Cache-Buster

#
# WARUM AUCH AUF push:main — die Lücke bei zwei offenen Pull Requests:
# Die neue Nummer wird aus dem ZIELZWEIG berechnet, und zwar zum Zeitpunkt des
# Laufs. Sind A und B gleichzeitig offen, rechnet B gegen das main VOR A. Wird
# danach A zusammengeführt, trägt B eine Nummer, die längst vergeben ist — B zu
# mergen ließe die Version stehen oder (bei kleinerer Stufe) sogar FALLEN. Ein
# Ereignis dafür gibt es nicht: GitHub meldet keinem Pull Request, dass sich
# sein Zielzweig bewegt hat. Deshalb zieht der push-Lauf die offenen Pull
# Requests selbst nach und prüft anschließend, dass die Nummer auf main
# wirklich gestiegen ist — die Wache für den Fall, dass doch etwas durchrutscht.

on:
  pull_request:
    # „edited" ist wichtig: der Titel trägt die Stufe, und der wird oft erst
    # nach dem Öffnen gesetzt oder korrigiert.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Ein Lauf je Pull Request (und einer je push auf main). Zwei gleichzeitige
# Läufe würden dieselbe Datei schreiben und sich gegenseitig überholen.
concurrency:
  group: version-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # zum Zurückschreiben in den Zweig des Pull Requests

jobs:
  nummern:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Zuerst das Skript holen — die Regel „Stufe aus dem Titel" steht dort
      # (scripts/version.mjs, stufeAusTitel) und nicht mehr hier als Shell-
      # Schleife: sie wird inzwischen an zwei Stellen gebraucht, und eine Regel,
      # die zweimal geschrieben ist, driftet.
      - name: Zweig des Pull Requests auschecken
        uses: actions/checkout@v4
        with:
          # Nicht den Merge-Ref (Standard bei pull_request): dorthin liesse sich
          # nicht zurückschreiben. Voller Verlauf, damit der Zielzweig
          # erreichbar ist.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Stufe aus dem Titel lesen
        id: stufe
        env:
          # Über die Umgebung, NICHT per ${{ }} in den Skriptkörper: ein Titel
          # ist Nutzereingabe und könnte sonst Shell-Befehle einschleusen.
          TITEL: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          wert="$(node scripts/version.mjs --stufe "$TITEL")" || {
            echo "::error::$(node scripts/version.mjs --stufe "$TITEL" 2>&1 || true)"
            exit 1
          }
          echo "wert=$wert" >> "$GITHUB_OUTPUT"
          echo "Stufe: $wert"

      - name: Nummern setzen
        id: setzen
        env:
          STUFE: ${{ steps.stufe.outputs.wert }}
          ZIEL: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ZIEL"
          # Die Basis kommt aus dem ZIELZWEIG, nicht aus der Datei im Zweig:
          # sonst hübe ein zweiter Lauf die schon angehobene Nummer erneut an.
          basis="$(git show "origin/$ZIEL:index.html" \
                   | grep -oE 'name="app-version" content="[^"]*"' \
                   | sed -E 's/.*content="([^"]*)"/\1/')"
          if [ -z "$basis" ]; then
            echo "::error::Im Zielzweig $ZIEL steht keine app-version in index.html."
            exit 1
          fi
          echo "Basis aus $ZIEL: $basis"
          node scripts/version.mjs "$STUFE" "$basis"
          if git diff --quiet -- index.html; then
            echo "geaendert=nein" >> "$GITHUB_OUTPUT"
          else
            echo "geaendert=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Zurückschreiben
        if: steps.setzen.outputs.geaendert == 'ja'
        env:
          STUFE: ${{ steps.stufe.outputs.wert }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          # „[skip ci]" im Betreff, und zwar aus einem handfesten Grund:
          #
          # Dieser Push ist selbst ein synchronize-Ereignis am Pull Request und
          # stößt damit genau diesen Workflow erneut an. In eine SCHLEIFE liefe
          # das nicht — einen mit GITHUB_TOKEN gepushten Lauf führt GitHub nicht
          # aus —, aber er wird trotzdem ANGELEGT und bleibt als
          # „action_required" gelb stehen, bis ihn jemand von Hand freigibt. Der
          # Pull Request steht solange auf „unstable". Genau diese Handarbeit
          # soll die Automatik abnehmen; die Marke verhindert schon das Anlegen.
          #
          # (Der frühere Kommentar hier behauptete, ein GITHUB_TOKEN-Push löse
          # gar nichts aus. Halb richtig: er löst keinen LAUF aus, hinterlässt
          # aber den freigabepflichtigen Eintrag — beobachtet an #107.)
          #
          # Sie wirkt NUR auf Workflows unter .github/workflows. CodeQL läuft
          # weiter (dessen Default-Setup liegt nicht dort und schert sich nicht
          # um die Marke) — gemessen an #108, wo CodeQL den Versions-Commit
          # sehr wohl gescannt hat. Die Prüftiefe des Pull Requests bleibt also,
          # weg fällt allein dieser eine Leerlauf.
          #
          # In den Squash-Text nach main gehört sie trotzdem nicht: dort bliebe
          # jeder künftige push-Workflow stillschweigend aus. Die
          # Zusammenfassung wird von Hand geschrieben (CLAUDE.md), nicht aus der
          # Commit-Liste übernommen — deshalb steht die Marke im Betreff, wo sie
          # dabei ins Auge fällt, statt versteckt im Rumpf.
          #
          # Und sie darf in KEINER Commit-Nachricht bloß erwähnt werden: GitHub
          # sucht sie irgendwo im Text. Der erste Anlauf dieser Änderung
          # erklärte sie im Rumpf und schaltete damit diesen Workflow für den
          # eigenen Pull Request ab.
          git commit -m "Version und Cache-Buster ($STUFE) [skip ci]" \
                     -m "Gesetzt von .github/workflows/version.yml aus dem PR-Titel."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

          # Was dieser Lauf gerade geschrieben hat, prüft folglich kein zweiter
          # Lauf mehr nach. Das ist vertretbar: der Commit fasst ausschließlich
          # index.html an, und zwar nur die Versionszeile und die ?v=-Werte, die
          # scripts/version.mjs selbst berechnet hat. Alles Übrige des Pull
          # Requests ist auf dem vorherigen Stand geprüft worden, und main wird
          # nach dem Zusammenführen ohnehin erneut gescannt.
          echo "::notice::Version gesetzt. Der Commit trägt [skip ci], damit kein freigabepflichtiger Leerlauf entsteht."

      - name: Nichts zu tun
        if: steps.setzen.outputs.geaendert == 'nein'
        run: echo "index.html war schon auf Stand."

  # ------------------------------------------------------------------ push
  # Nach jedem Zusammenführen: erst nachsehen, ob die Nummer überhaupt
  # gestiegen ist, dann die noch offenen Pull Requests auf die neue Basis
  # umrechnen. Beides greift genau in der Lücke, die kein Ereignis meldet —
  # dass sich der Zielzweig unter einem offenen Pull Request bewegt hat.
  wache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      # Der Ablauf steht in scripts/version-wache.sh, nicht hier: Was einen
      # Merge rot färben kann, gehört geprüft — und ein Shell-Block in der YAML
      # lässt sich nicht ausführen, ohne den Workflow laufen zu lassen.
      - name: Ist die Version gestiegen?
        run: scripts/version-wache.sh

      - name: Offene Pull Requests auf die neue Basis umrechnen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          basis="$(grep -oE 'name="app-version" content="[^"]*"' index.html \
                   | sed -E 's/.*content="([^"]*)"/\1/')"
          echo "Neue Basis auf main: $basis"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nur Pull Requests aus DIESEM Repository: in fremde Gabelungen lässt
          # sich nicht zurückschreiben, und der Versuch bräche den Lauf ab.
          gh pr list --state open --base main --limit 50 \
             --json number,title,headRefName,headRepositoryOwner,isCrossRepository \
             > offene.json
          anzahl="$(jq 'length' offene.json)"
          echo "Offene Pull Requests: $anzahl"

          for i in $(seq 0 $((anzahl - 1))); do
            nr="$(jq -r ".[$i].number" offene.json)"
            fremd="$(jq -r ".[$i].isCrossRepository" offene.json)"
            zweig="$(jq -r ".[$i].headRefName" offene.json)"
            titel="$(jq -r ".[$i].title" offene.json)"
            if [ "$fremd" = "true" ]; then
              echo "#$nr liegt in einer Gabelung — übersprungen."
              continue
            fi
            if ! stufe="$(node scripts/version.mjs --stufe "$titel" 2>&1)"; then
              # Fehlt die Stufe, meldet das ohnehin der Lauf am Pull Request
              # selbst. Hier nur vermerken und weitergehen.
              echo "#$nr: $stufe — übersprungen."
              continue
            fi
            git fetch --no-tags origin "$zweig"
            git checkout -B "pr-$nr" "origin/$zweig"
            node scripts/version.mjs "$stufe" "$basis"
            if git diff --quiet -- index.html; then
              echo "#$nr war schon auf Stand."
            else
              git add index.html
              # Marke im Betreff wie beim Lauf am Pull Request: Dieser Push ist
              # ein synchronize-Ereignis und legte sonst einen gelben,
              # freigabepflichtigen Leerlauf an.
              git commit -m "Version und Cache-Buster ($stufe) [skip ci]" \
                         -m "Auf die neue Basis $basis umgerechnet, nachdem main sich bewegt hat."
              git push origin "HEAD:$zweig"
              echo "::notice::#$nr auf Basis $basis umgerechnet."
            fi
            git checkout --detach
          done
