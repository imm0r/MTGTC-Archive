# Trägt das geteilte Preisarchiv public.price_history täglich aus MTGJSON fort
# (Cardmarket-EUR + TCGplayer-USD). MTGJSON liefert je Lauf ~90 Tage; die
# Datenbank MISCHT sie in den Bestand (merge_price_history), statt ihn zu
# ersetzen — so wächst der Verlauf über die 90 Tage hinaus. Läuft serverseitig;
# der service_role-Key liegt als Repository-Secret, nie im Browser.
#
# Täglich ist reichlich Luft: lückenlos bleibt der Verlauf, solange zwischen
# zwei Läufen keine 90 Tage liegen. Ein ausgefallener Tag holt sich die
# verpassten Werte beim nächsten Lauf rückwirkend zurück.
#
# Nötige Secrets (Repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL                 z. B. https://abcd.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    service_role-Key aus Project Settings → API
name: Preisarchiv (MTGJSON)

on:
  schedule:
    # Voller Lauf, sonntags 15:00 UTC — nach MTGJSONs Tages-Build (live
    # ~09:00 EST). Holt die vollen 90 Tage: fängt Korrekturen ein, die MTGJSON
    # nachträglich an zurückliegenden Tagen vornimmt, heilt Tage, an denen der
    # Tageslauf ausfiel, und trägt die uuid nach, von der er lebt.
    # Cron ist immer UTC.
    - cron: "0 15 * * 0"
    # Tageslauf, montags bis samstags 15:00 UTC. Lädt allein AllPricesToday
    # (5,2 MB statt 358 MB) und hängt einen Punkt je Karte an.
    - cron: "0 15 * * 1-6"
    # Lückenprüfung, stündlich. Die 15 fehlt bewusst: sonst feuerte sie zur
    # selben Minute wie die beiden anderen.
    - cron: "0 0-14,16-23 * * *"
  workflow_dispatch: {}

# Warteschlange statt Abbruch: ein angefangener voller Lauf soll nicht von
# einer Lückenprüfung erschlagen werden. Gefährlich wäre ein Abbruch nicht —
# das Mischen ist additiv, eine halb geschriebene Runde ergänzt der nächste
# Lauf —, aber einen fast fertigen 1-GB-Durchlauf wegzuwerfen ist Verschwendung.
concurrency:
  group: price-backfill
  cancel-in-progress: false

# Least Privilege: Der Job liest nur den Code aus (Checkout) und spricht sonst
# ausschließlich mit Supabase und MTGJSON — die GitHub-API braucht er nie.
# Ohne diesen Block erbt GITHUB_TOKEN die (evtl. zu weiten) Repo-Standardrechte.
permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/price-backfill/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: scripts/price-backfill
        run: npm ci --no-audit --no-fund

      - name: Preisarchiv fortschreiben
        working-directory: scripts/price-backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # AllPrices ist entpackt ~1 GB; großzügiger Heap für den Stream-Parser.
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Jeder Zeitplan bekommt seine Betriebsart. Ein Start von Hand fällt
          # bewusst in den vollen Lauf: von Hand startet man den Job, WEIL man
          # alles aufgefrischt haben will.
          MODUS: >-
            ${{ github.event.schedule == '0 0-14,16-23 * * *' && '--only-gaps'
             || (github.event.schedule == '0 15 * * 1-6' && '--today' || '') }}
        run: node backfill.mjs $MODUS
